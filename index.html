<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>الخليجي الأول - طلب جديد</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:system-ui,-apple-system,"Segoe UI",Arial;color:#171717}.w{max-width:560px;margin:auto;padding:18px}.brand{text-align:center;font-size:28px;font-weight:1000;margin:18px 0}.card{background:#fff;border:1px solid #e7e7e7;border-radius:24px;padding:20px;margin:12px 0;box-shadow:0 5px 22px #0000000c}.muted{color:#777}.center{text-align:center}.ok{background:#eefbf2;color:#166a31;padding:12px;border-radius:13px}.bad{background:#fff0f0;color:#a11;padding:12px;border-radius:13px}.big{font-size:82px;line-height:1;font-weight:1000;text-align:center;margin:18px 0}.hero{font-size:22px;font-weight:950;text-align:center}button,.btn{width:100%;border:0;border-radius:15px;padding:16px;background:#111;color:#fff;font-weight:950;font-size:19px;margin-top:12px;text-decoration:none;display:block;text-align:center}.wa{background:#111}.sec{background:#ededed;color:#111}.hint{background:#f7f7f8;border-radius:14px;padding:13px;margin-top:12px;line-height:1.8}.last{font-size:13px;color:#666;text-align:center;margin-top:12px}.pulse{font-size:15px}
</style></head>
<body><div class="w"><div class="brand">الخليجي الأول</div><div id="app"></div></div>
<script>
const DEFAULT_GAS_API="https://script.google.com/macros/s/AKfycbxW1Tam-ikjtl8-UQej_FsGskBueLio96nVNIPAW24jqFMmPGABGm85hbxNfaZy3WT4/exec";
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
const qs=new URLSearchParams(location.search);
function gasUrlFromDeploymentId(id){
  id=String(id||'').trim();
  return id ? 'https://script.google.com/macros/s/'+encodeURIComponent(id)+'/exec' : '';
}
function deploymentIdFromGasUrl(url){
  try{
    const u=new URL(url);
    const m=u.pathname.match(/\/macros\/s\/([^/]+)\/exec$/);
    return m ? decodeURIComponent(m[1]) : '';
  }catch(e){return ''}
}
if(qs.get('c')&&(qs.get('t')||qs.get('k'))){
  const token=qs.get('t')||qs.get('k');
  const targetApi=gasUrlFromDeploymentId(qs.get('d')) || qs.get('api') || localStorage.getItem('gasApi') || DEFAULT_GAS_API;
  const target=targetApi+'?customer=1&order='+encodeURIComponent(qs.get('c'))+'&t='+encodeURIComponent(token);
  location.replace(target);
}
if(qs.get('api'))localStorage.setItem('gasApi',qs.get('api'));
if(qs.get('emp'))localStorage.setItem('empToken',qs.get('emp'));
const api=localStorage.getItem('gasApi')||DEFAULT_GAS_API,emp=localStorage.getItem('empToken')||'';let employee=null,last=null,busy=false;
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function jsonp(url){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(16).slice(2);window[cb]=d=>{delete window[cb];s.remove();resolve(d)};const s=document.createElement('script');s.onerror=()=>{delete window[cb];s.remove();reject(new Error('تعذر الاتصال بالنظام'))};s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.body.appendChild(s)})}
function rid(){return Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,12)}
async function boot(){if(!api||!emp){app.innerHTML='<div class="card bad"><b>هذا الجهاز غير مفعّل.</b><br>افتح رابط الموظف الذي ينسخه المدير مرة واحدة فقط.</div>';return}app.innerHTML='<div class="card center">جاري التحقق من التفعيل...</div>';try{const r=await jsonp(api+'?api=employeeInfo&emp='+encodeURIComponent(emp));if(!r.ok)throw new Error(r.error);employee=r.employee;home()}catch(e){app.innerHTML='<div class="card bad">'+esc(e.message)+'</div>'}}
function home(){app.innerHTML=`<div class="card center"><div class="muted">الموظف</div><h2>${esc(employee.name)}</h2><div class="ok pulse">✅ الجهاز مفعّل وجاهز</div></div><div class="card"><div class="hero">عند تجهيز أغراض الزبونة</div><div class="hint">1) اضغط <b>إنشاء طلب جديد</b>.<br>2) اكتب الرقم الذي يظهر على الكيس فوراً.<br>3) اضغط <b>إرسال رابط العنوان للزبونة</b> واخترها من واتساب.<br>4) الزبونة تعبّي عنوانها، والطلب يتحدث عند الكاشير تلقائياً.</div><button id="newBtn" onclick="createOrder()">إنشاء طلب جديد</button><div class="last">لا نسخ رسائل، لا WhatsApp API، ولا تحتاج رقم هاتف الموظف.</div></div>`}
async function createOrder(){if(busy)return;busy=true;const b=document.getElementById('newBtn');if(b){b.disabled=true;b.textContent='جاري إنشاء الرقم...'}const req=rid();try{const r=await jsonp(api+'?api=employeeCreate&emp='+encodeURIComponent(emp)+'&rid='+encodeURIComponent(req));if(!r.ok)throw new Error(r.error);if(!r.customerToken)throw new Error('تعذر إنشاء رابط الزبونة بشكل صحيح. أعد المحاولة بعد تحديث النظام.');last=r;showOrder()}catch(e){busy=false;app.innerHTML='<div class="card bad">'+esc(e.message)+'</div><button onclick="home()">إعادة المحاولة</button>'}}
function shortCustomerUrl(){
  const order=String(last.orderNo||'');
  const token=String(last.customerToken||'').trim();
  const dep=deploymentIdFromGasUrl(api);
  if(order&&token&&dep){
    return location.origin+location.pathname+
      '?c='+encodeURIComponent(order)+
      '&t='+encodeURIComponent(token)+
      '&d='+encodeURIComponent(dep);
  }
  if(order&&token){
    return location.origin+location.pathname+
      '?c='+encodeURIComponent(order)+
      '&t='+encodeURIComponent(token)+
      '&api='+encodeURIComponent(api);
  }
  // Legacy fallback only.
  try{
    const u=new URL(last.customerUrl||'');
    const legacy=u.searchParams.get('t')||u.searchParams.get('k')||'';
    if(order&&legacy&&dep){
      return location.origin+location.pathname+
        '?c='+encodeURIComponent(order)+
        '&t='+encodeURIComponent(legacy)+
        '&d='+encodeURIComponent(dep);
    }
  }catch(e){}
  return last.customerUrl||'';
}
function whatsappMessage(){
  const link=shortCustomerUrl();
  return `🛍️ *الخليجي الأول*\n\nتم تجهيز طلبك رقم *#${last.orderNo}* ✅\n\nيرجى تعبئة عنوان التوصيل من الرابط التالي:\n📍 ${link}\n\nبعد تعبئة العنوان سيصلنا تلقائيًا.\n\nشكرًا لاختيارك *الخليجي الأول* 🤍`;
}
function showOrder(){busy=false;const link=shortCustomerUrl();const msg=whatsappMessage();const wa='https://wa.me/?text='+encodeURIComponent(msg);app.innerHTML=`<div class="card center"><div class="ok">✅ تم إنشاء الطلب</div><p class="muted">اكتب هذا الرقم على الكيس الآن</p><div class="big">#${esc(last.orderNo)}</div><div class="hint"><b>بعد كتابة الرقم على الكيس:</b><br>اضغط الزر التالي واختر الزبونة من واتساب.<br>ستظهر لها رسالة مرتبة باسم الخليجي الأول ورقم الطلب ورابط مختصر.</div><a class="btn wa" href="${wa}">إرسال رسالة العنوان للزبونة على واتساب</a><button class="sec" onclick="copyMessage()">نسخ الرسالة كاملة</button><button class="sec" onclick="copyLink()">نسخ رابط العنوان فقط</button><div class="last">الرابط المرسل: ${esc(link)}</div><button onclick="home()">إنشاء طلب آخر</button></div>`}
async function copyMessage(){const msg=whatsappMessage();try{await navigator.clipboard.writeText(msg);alert('تم نسخ الرسالة كاملة')}catch(e){prompt('انسخ الرسالة:',msg)}}
async function copyLink(){const link=shortCustomerUrl();try{await navigator.clipboard.writeText(link);alert('تم نسخ رابط العنوان')}catch(e){prompt('انسخ الرابط:',link)}}
boot();
</script></body></html>
